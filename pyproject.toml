[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["epstein"]

[project]
name = "epstein"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pydantic>=2.13.0b2",
    "polars>=1.39.0",
    "spacy>=3.8.13",
    "tqdm>=4.67.0",
    "beautifulsoup4>=4.14.3",
    "torch>=2.11.0",
    "thinc-apple-ops; sys_platform == 'darwin'",
    "duckdb>=1.5.1",
    "fasttext-numpy2>=0.9.2",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "nltk>=3.9.4",
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
]

